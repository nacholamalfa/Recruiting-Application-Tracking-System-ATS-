name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancela ejecuciones anteriores si se sube nuevo código al mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Permite a Turbo comparar cambios contra el commit anterior

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 🏎️ Configurar Caché de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🔍 Validar Lint
        run: pnpm lint

      - name: 🧪 Ejecutar Tests Unitarios
        run: pnpm test

      - name: 🔁 Ejecutar Tests de Regresión
        run: pnpm test:regression

      - name: ☁️ Ejecutar Tests de Integración
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: w9jds/firebase-action@master
        with:
          args: emulators:exec --only auth,functions,firestore,storage --import=./emulator-data "pnpm test:integration"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.GCLOUD_PROJECT }}
